# DOT API — Nginx site config
#
# Redirige HTTP → HTTPS y hace proxy a nordik-api:8000.
# TLS terminado en Nginx (Certbot).
# Rate limiting: 60 req/min general, 5 req/min en /v1/auth/login.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirigir HTTP a HTTPS (si hay certificado)
    # En entornos sin TLS, comentar el redirect y servir directo.
    # return 301 https://$host$request_uri;

    # Sin TLS: proxy directo con rate limiting
    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://nordik-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Rate limiting más agresivo en login
    location /v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://nordik-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Panel admin — solo red interna
    location /admin/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://dot-admin-api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
