# Prometheus configuration — Nordik-IA
#
# Scrapes:
#   - nordik-api:8000/metrics (métricas de aplicación)
#
# Alertas definidas en alert_rules.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: nordik-api
    metrics_path: /metrics
    static_configs:
      - targets: ['nordik-api:8000']
        labels:
          service: nordik-api
          env: production
    scrape_interval: 15s
    scrape_timeout: 5s

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
