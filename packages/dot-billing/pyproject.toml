[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dot-billing"
version = "0.1.0"
description = "Modelos SQLAlchemy y utilidades compartidas de billing DOT"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0.36",
  "bcrypt>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27.0",
]
full = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "psycopg[binary]>=3.2.0",
  "apscheduler>=3.10.4",
  "httpx>=0.27.0",
  "slowapi>=0.1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dot_billing*"]

[tool.ruff]
# Configuración del paquete compartido — conservadora (errores de sintaxis + pyflakes)
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401", "F841", "F811"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["F821"]
"tests/*" = ["F821"]
