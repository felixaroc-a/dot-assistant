;; ============================================================
;; PgBouncer connection pool — configuración para DOT en producción
;; ============================================================
;; Instalar: apt install pgbouncer
;; Config:   cp pgbouncer.ini /etc/pgbouncer/pgbouncer.ini
;; Iniciar:  systemctl enable --now pgbouncer
;; Verificar: systemctl status pgbouncer
;;
;; PgBouncer actúa como proxy entre DOT y Postgres,
;; manteniendo un pool de conexiones persistente.
;; DOT se conecta a PgBouncer (puerto 6432) que redirige
;; a Postgres (puerto 5432).
;; ============================================================

[databases]
;; Base de datos de billing de Nordik-IA
nordik_billing = host=127.0.0.1 port=5432 dbname=nordik_billing

;; Si Postgres está en otro servidor (GCP Cloud SQL):
;; nordik_billing = host=10.0.0.5 port=5432 dbname=nordik_billing

[pgbouncer]
;; ── Conexiones ──────────────────────────────────
;; Puerto donde PgBouncer escucha (DOT se conecta aquí)
listen_port = 6432
listen_addr = 127.0.0.1

;; Tipo de pooling:
;;   session     — una conexión por sesión (compatible con todo)
;;   transaction — una conexión por transacción (mejor rendimiento)
;;   statement   — una conexión por statement (máximo rendimiento)
;;
;; DOT usa SQLAlchemy con sessionmaker, requiere session pooling
;; porque mantiene estado entre queries (identity map, flush).
pool_mode = session

;; Máximo de conexiones que PgBouncer puede abrir a Postgres
default_pool_size = 20

;; Conexiones extra que se pueden abrir bajo carga pico
reserve_pool_size = 5

;; Timeout para adquirir conexión del pool (segundos)
reserve_pool_timeout = 3

;; Máximo de clientes concurrentes conectados a PgBouncer
max_client_conn = 100

;; Máximo de conexiones totales a Postgres (todas las DBs)
max_db_connections = 50

;; Máximo de conexiones por usuario
max_user_connections = 50

;; ── Timeouts ────────────────────────────────────
;; Tiempo máximo que un cliente puede estar inactivo (segundos)
client_idle_timeout = 600

;; Tiempo máximo que una conexión a Postgres puede estar inactiva
server_idle_timeout = 600

;; Tiempo máximo de vida de una conexión a Postgres (segundos)
;; Debe ser MAYOR que pool_recycle de SQLAlchemy (3600)
server_lifetime = 7200

;; Tiempo máximo que una conexión puede estar en el pool sin usarse
server_idle_timeout = 300

;; ── Seguridad ───────────────────────────────────
;; Solo aceptar conexiones locales (DOT y PgBouncer en mismo host)
; auth_type = trust  ; Solo para dev/local
auth_type = scram-sha-256  ; Producción

;; Archivo de usuarios (mismo formato que pg_hba.conf)
auth_file = /etc/pgbouncer/userlist.txt
;; Formato del archivo: "username" "password"
;; Generar hash: echo -n "passwordusername" | md5sum

;; ── Logs ────────────────────────────────────────
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

;; Archivo de log
logfile = /var/log/pgbouncer/pgbouncer.log

;; ── Stats ───────────────────────────────────────
;; Estadísticas accesibles via consola admin
stats_period = 60

;; ── Admin console ───────────────────────────────
;; Conectarse para ver stats: psql -p 6432 -U pgbouncer pgbouncer
admin_users = pgbouncer

[users]
;; Mapeo de usuarios — hereda de auth_file si no se especifica
