<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal DOT</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: #1a1a2e;
      padding: 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 {
      color: #e94560;
      margin: 0 0 1.5rem;
      text-align: center;
      font-size: 1.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #aaa;
      font-size: 0.9rem;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #333;
      border-radius: 6px;
      background: #16213e;
      color: #eee;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #e94560;
      box-shadow: 0 0 0 2px rgba(233,69,96,0.2);
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: #d6384f; }
    .error {
      color: #e94560;
      margin-bottom: 1rem;
      text-align: center;
      padding: 0.5rem;
      background: rgba(233,69,96,0.1);
      border-radius: 6px;
    }
    .footer {
      text-align: center;
      margin-top: 1.5rem;
      color: #555;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Portal DOT</h1>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/portal">
      <label for="cedula">Cédula</label>
      <input id="cedula" name="cedula" placeholder="Número de cédula" required autocomplete="username">
      <label for="clave">Clave de acceso</label>
      <input id="clave" type="password" name="clave" placeholder="Tu clave" required autocomplete="current-password">
      <button type="submit">Ingresar</button>
    </form>
    <div class="footer">DOT &mdash; Portal del cliente</div>
  </div>
</body>
</html>
