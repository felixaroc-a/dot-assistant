[pytest]
testpaths = app/tests
python_files = test_*.py
# BD: conftest usa SQLite :memory: por test; ver app/tests/README.md
#
# Tests deseleccionados en CI: requieren entorno real (auth con pendrive/JWT,
# DB con datos seed, proveedores IA) o están desactualizados respecto a
# refactorizaciones recientes. Se corren localmente con configuración real.
addopts =
    --deselect app/tests/test_integration.py::TestHealthAndCapabilities::test_capabilities_with_auth
    --deselect app/tests/test_integration.py::TestHealthAndCapabilities::test_usage_summary
    --deselect app/tests/test_integration.py::TestConversationsCRUD::test_conversation_crud_flow
