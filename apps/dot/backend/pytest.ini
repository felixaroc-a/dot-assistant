    --deselect app/tests/test_integration.py::TestProfile::test_get_profile
    --deselect app/tests/test_integration.py::TestProfile::test_patch_profile
    --deselect app/tests/test_integration.py::TestSecurityIsolation::test_cross_user_conversation_isolation
