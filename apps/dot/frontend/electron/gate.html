<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';" />
    <title>DOT — Llave USB</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #050505;
        color: #f5f5f7;
        text-align: center;
      }
      .gate-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.5;
        color: rgba(235, 235, 245, 0.72);
      }
      .gate-status {
        margin: 0;
        font-size: 0.85rem;
        color: rgba(235, 235, 245, 0.55);
      }
      .gate-orbit {
        position: relative;
        width: 3.5rem;
        height: 3.5rem;
        animation: gate-orbit-spin 1.1s linear infinite;
      }
      .gate-orbit__dot {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0.45rem;
        height: 0.45rem;
        margin: -0.225rem 0 0 -0.225rem;
        border-radius: 50%;
        background: rgba(159, 199, 255, 0.95);
        box-shadow: 0 0 8px rgba(120, 160, 255, 0.35);
      }
      @keyframes gate-orbit-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .gate-retry {
        flex: 0 0 auto;
        min-width: auto;
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
        border-radius: 8px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: rgba(235, 235, 245, 0.92);
        cursor: default;
        font-family: inherit;
        margin-top: 0.25rem;
      }
      @media (prefers-reduced-motion: reduce) {
        .gate-orbit {
          animation: none;
        }
        .gate-orbit__dot {
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <div class="gate-container">
      <h1>Conecta tu llave DOT</h1>
      <p>Inserta el pendrive USB que te entregaron.</p>
      <p class="gate-status" id="gate-status">Buscando llave DOT en los puertos USB…</p>
      <div class="gate-orbit" aria-hidden="true" id="gate-orbit">
        <span class="gate-orbit__dot" style="transform: rotate(0deg) translateY(-1.35rem); opacity: 0.35;"></span>
        <span class="gate-orbit__dot" style="transform: rotate(45deg) translateY(-1.35rem); opacity: 0.43;"></span>
        <span class="gate-orbit__dot" style="transform: rotate(90deg) translateY(-1.35rem); opacity: 0.51;"></span>
        <span class="gate-orbit__dot" style="transform: rotate(135deg) translateY(-1.35rem); opacity: 0.59;"></span>
        <span class="gate-orbit__dot" style="transform: rotate(180deg) translateY(-1.35rem); opacity: 0.67;"></span>
        <span class="gate-orbit__dot" style="transform: rotate(225deg) translateY(-1.35rem); opacity: 0.75;"></span>
        <span class="gate-orbit__dot" style="transform: rotate(270deg) translateY(-1.35rem); opacity: 0.83;"></span>
        <span class="gate-orbit__dot" style="transform: rotate(315deg) translateY(-1.35rem); opacity: 0.91;"></span>
      </div>
      <button type="button" class="gate-retry" id="gate-retry" disabled>Reintentar ahora</button>
    </div>
  </body>
</html>
