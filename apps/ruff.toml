# ruff.toml — Configuración de linting para Nordik-IA (Python)
#
# Aplica a: apps/dot/backend/, packages/dot-billing/
#
# Selección conservadora: solo errores de sintaxis (E9) y pyflakes (F),
# que son los que el código del proyecto cumple. Las reglas de estilo
# estrictas (N/UP/SIM/B) se omiten porque el código legacy no las cumple.

# Python 3.12 (el código usa f-strings con escape, feature de 3.12)
target-version = "py312"

line-length = 100
indent-width = 4

[lint]
select = [
    "E9",   # Errores de sintaxis (SyntaxError, etc.)
    "F",    # Pyflakes (undefined names, unused imports)
]

ignore = [
    "F401",  # imports sin usar (legacy)
    "F841",  # variables locales sin usar (legacy)
    "F811",  # redefiniciones (legacy)
]

[lint.per-file-ignores]
# Los tests usan names inyectados por pytest/conftest
"*/tests/*" = ["F821"]
"tests/*" = ["F821"]

[lint.isort]
known-first-party = ["dot_billing", "app"]
force-single-line = false
combine-as-imports = true
