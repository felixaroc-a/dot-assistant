name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/dot/backend/requirements-dev.txt
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check apps/dot/backend/app packages/dot-billing/dot_billing

  typecheck-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            apps/dot/backend/requirements.txt
            apps/dot/backend/requirements-dev.txt
      - name: Install mypy and deps
        run: |
          pip install -r apps/dot/backend/requirements-dev.txt
          pip install -e packages/dot-billing
          pip install -r apps/dot/backend/requirements.txt
      - name: Mypy check
        run: |
          cd apps/dot/backend && mypy app
          cd ../../packages/dot-billing && mypy dot_billing

  test-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/dot-billing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/dot-billing/pyproject.toml
      - name: Install and test
        run: |
          pip install -e ".[dev]"
          python -m pytest tests/ -v

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dot/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            apps/dot/backend/requirements.txt
            apps/dot/backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -e ../../packages/dot-billing
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest app/tests/ -v --cov=app --cov-fail-under=60 --cov-report=term

  lint-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/dot/frontend/package-lock.json
      - name: Install and lint
        run: |
          npm ci
          npm run lint
      - name: TypeScript check
        run: npx tsc -b --pretty false

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/dot/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npm test

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/dot/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (vite + tsc)
        run: npm run build

  security-audit-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/dot/backend/requirements.txt
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r apps/dot/backend/requirements.txt

  security-audit-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/dot/frontend/package-lock.json
      - name: npm audit
        run: |
          npm ci
          npm audit --audit-level=critical

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
