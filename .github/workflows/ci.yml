name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/dot/backend/requirements-dev.txt
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check apps/dot/backend/app packages/dot-billing/dot_billing

  typecheck-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dot/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/dot/backend/requirements.txt
            apps/dot/backend/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade "pip<25"
          pip install -e ../../../packages/dot-billing[full]
          pip install -r requirements-dev.txt
          grep -v '^-e ' requirements.txt > /tmp/req-audit.txt && pip install -r /tmp/req-audit.txt
      - name: Mypy check (módulos tipados)
        run: |
          cd ../../../packages/dot-billing && mypy dot_billing

  test-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/dot-billing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/dot-billing/pyproject.toml
      - name: Install and test
        run: |
          pip install -e ".[dev]"
          python -m pytest tests/ -v

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: apps/dot/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/dot/backend/requirements.txt
            apps/dot/backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          pip install -e ../../../packages/dot-billing[full]
          pip install -r requirements-dev.txt
          grep -v '^-e ' requirements.txt > /tmp/req-audit.txt && pip install -r /tmp/req-audit.txt
      - name: Run backend tests (shard ${{ matrix.shard }})
        run: python -m pytest app/tests/ -q --no-cov --timeout=60 --shard-id=${{ matrix.shard }} --num-shards=6

  lint-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/dot/frontend/package-lock.json
      - name: Install and lint
        run: |
          npm ci --ignore-scripts
          npm run lint
      - name: TypeScript check (app)
        run: npx tsc --noEmit -p config/tsconfig.app.json --pretty false

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/dot/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run vitest
        run: npm test

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/dot/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build (vite)
        run: npx vite build --config config/vite.config.ts

  security-audit-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/dot/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/dot/backend/requirements.txt
      - name: pip-audit
        run: |
          python -m pip install --upgrade "pip<25"
          pip install -e ../../../packages/dot-billing[full]
          grep -v '^-e ' requirements.txt > /tmp/req-audit.txt && pip install -r /tmp/req-audit.txt
          pip install pip-audit
          pip-audit --local

  security-audit-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/dot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/dot/frontend/package-lock.json
      - name: npm audit (production deps)
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=critical

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
