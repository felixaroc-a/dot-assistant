name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/dot/backend/requirements-dev.txt
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check apps/dot/backend/app packages/dot-billing/dot_billing

  typecheck-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dot/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/dot/backend/requirements.txt
            apps/dot/backend/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade "pip<25"
          pip install -e ../../../packages/dot-billing[full]
          pip install -r requirements-dev.txt
          grep -v '^-e ' requirements.txt > /tmp/req-audit.txt && pip install -r /tmp/req-audit.txt
      - name: Mypy check (módulos tipados)
        run: |
          cd ../../../packages/dot-billing && mypy dot_billing

  test-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/dot-billing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/dot-billing/pyproject.toml
      - name: Install and test
        run: |
          pip install -e ".[dev]"
          python -m pytest tests/ -v

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: apps/dot/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/dot/backend/requirements.txt
            apps/dot/backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          pip install -e ../../../packages/dot-billing[full]
          pip install -r requirements-dev.txt
          grep -v '^-e ' requirements.txt > /tmp/req-audit.txt && pip install -r /tmp/req-audit.txt
      - name: Run backend tests (shard ${{ matrix.shard }})
        run: |
          python -m pytest app/tests/ -q --no-cov \
            --timeout=60 \
            --shard-id=${{ matrix.shard }} --num-shards=6 \
            --deselect "app/tests/test_integration.py::TestHealthAndCapabilities::test_capabilities_with_auth" \
            --deselect "app/tests/test_integration.py::TestHealthAndCapabilities::test_usage_summary" \
            --deselect "app/tests/test_integration.py::TestConversationsCRUD::test_conversation_crud_flow" \
            --deselect "app/tests/test_integration.py::TestWebSocketAuth::test_ws_accepted_with_valid_token" \
            --deselect "app/tests/test_integration.py::TestRefreshTokenRotation::test_refresh_reuse_detection" \
            --deselect "app/tests/test_auth_integration.py::TestAuthLoginIntegration::test_login_403_subscription_expired" \
            --deselect "app/tests/test_pendrive_recovery.py::test_recovery_login_subscription_expired" \
            --deselect "app/tests/test_chat_context_browser_hint.py::test_build_system_prompt_browser_hint_when_enabled" \
            --deselect "app/tests/test_chat_summarize.py::test_chat_summarize_provider_unavailable" \
            --deselect "app/tests/test_code_execution.py::TestMockedExecution::test_sandbox_unavailable_raises" \
            --deselect "app/tests/test_code_execution.py::TestRestEndpoints::test_sandbox_unavailable_in_endpoint" \
            --deselect "app/tests/test_create_automation_tools.py::test_create_automation_multi_step_pipeline" \
            --deselect "app/tests/test_doc_pipeline_deep.py::test_chunk_by_section_oversized_section_subdivides" \
            --deselect "app/tests/test_doc_pipeline_deep.py::test_chunk_by_paragraph_splits_on_blank_lines" \
            --deselect "app/tests/test_hardening_phase5.py::test_pendrive_verify_route_registered" \
            --deselect "app/tests/test_image_tools.py::test_generate_image_tool_usage_limit" \
            --deselect "app/tests/test_images_router.py::test_images_generate_invalid_prompt" \
            --deselect "app/tests/test_pipeline_file_access.py::test_trigger_does_not_call_llm" \
            --deselect "app/tests/test_profile.py::test_get_users_me_profile_json_contract" \
            --deselect "app/tests/test_whatsapp_auto_reply.py::test_run_whatsapp_auto_reply_calls_same_brain_and_outbound"

  lint-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/dot/frontend/package-lock.json
      - name: Install and lint
        run: |
          npm ci --ignore-scripts
          npm run lint
      - name: TypeScript check (app)
        run: npx tsc --noEmit -p config/tsconfig.app.json --pretty false

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/dot/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run vitest
        run: npm test

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/dot/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build (vite)
        run: npx vite build --config config/vite.config.ts

  security-audit-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/dot/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/dot/backend/requirements.txt
      - name: pip-audit
        run: |
          python -m pip install --upgrade "pip<25"
          pip install -e ../../../packages/dot-billing[full]
          grep -v '^-e ' requirements.txt > /tmp/req-audit.txt && pip install -r /tmp/req-audit.txt
          pip install pip-audit
          pip-audit --local

  security-audit-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/dot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/dot/frontend/package-lock.json
      - name: npm audit (production deps)
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=critical

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
